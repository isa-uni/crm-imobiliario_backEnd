spring.datasource.url=jdbc:postgresql://localhost:5432/crm_corretora
spring.datasource.username=postgres
spring.datasource.password=postgre

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.springframework.security=WARN
#create-drop
# --- CRM Empreendimentos (CV CRM) ---
crm.base-url=https://pride.cvcrm.com.br
crm.refresh-seg=21600
crm.espera-seg=300
crm.cors-origem=*
crm.sync-no-startup=true
crm.pdf-storage=./data/pdfs

# Rate limiting login - opção A: por email (5) + por IP (20) em janela de 5min
app.rate-limit.login.max-attempts-per-email=5
app.rate-limit.login.max-attempts-per-ip=20
app.rate-limit.login.window-ms=300000

# Jackson já configurado via JacksonConfig; scheduling habilitado em BackApplication