spring.application.name=back

# JWT - usar variavel de ambiente JWT_SECRET em prod (min 64 chars). Fallback apenas para dev.
api.security.token.secret=${JWT_SECRET:minha-chave-dev-apenas-para-desenvolvimento-com-64-caracteres-minimo-1234567890ABCDEF}
api.security.token.access-expiration=${JWT_ACCESS_EXP:900000}
api.security.token.refresh-expiration=${JWT_REFRESH_EXP:604800000}
api.security.cookie.secure=${COOKIE_SECURE:false}
api.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
# Limpeza diária de tokens expirados (blacklist e refresh tokens)
app.security.limpeza-tokens-cron=0 0 3 * * *

# CORS - origens do frontend autorizadas (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}


# Banco - em produção defina DB_URL, DB_USERNAME e DB_PASSWORD (os valores padrão são só para dev local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crm_corretora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgre}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
# --- CRM Empreendimentos (CV CRM) ---
crm.base-url=https://pride.cvcrm.com.br
crm.refresh-seg=21600
crm.espera-seg=300
crm.sync-no-startup=true
crm.pdf-storage=${CRM_STORAGE_PATH:./data/empreendimentos}

# Rate limiting login - opção A: por email (5) + por IP (20) em janela de 5min
app.rate-limit.login.max-attempts-per-email=5
app.rate-limit.login.max-attempts-per-ip=20
app.rate-limit.login.window-ms=300000
# Só ative atrás de um proxy reverso que sobrescreve X-Forwarded-For (senão o cliente forja o IP)
app.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# Extracao de documentos de empreendimento - limites (sem IA generativa; ver DocumentExtractionOrchestrator)
crm.extracao.max-pdf-pages=40

# Jackson já configurado via JacksonConfig; scheduling habilitado em BackApplication
# E-mail das notificações (inativação de corretor / leads atribuídos). Sem spring.mail.host o e-mail não é
# enviado (só registrado no log) e a notificação continua aparecendo no sino da plataforma. Exemplo:
# spring.mail.host=${MAIL_HOST}
# spring.mail.port=${MAIL_PORT:587}
# spring.mail.username=${MAIL_USERNAME}
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# app.mail.remetente=CRM Imóveis <nao-responda@suaempresa.com.br>
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
